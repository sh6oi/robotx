
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-RAY CLINIC SIMULATOR</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101010;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 950px;
    text-align: center;
}

.logo {
    font-size: 35px;
    font-weight: bold;
    margin-bottom: 12px;
    letter-spacing: 2px;
}

.logo span {
    color: #ffcc00;
}

.subtitle {
    color: #aaa;
    font-size: 15px;
    margin-bottom: 35px;
}

.game-card {
    background: #1c1c1c;
    border: 1px solid #383838;
    border-radius: 18px;
    padding: 35px 20px;
    box-shadow: 0 10px 40px #0008;
}

.xray-icon {
    font-size: 65px;
    margin-bottom: 20px;
}

h2 {
    font-size: 24px;
    margin-bottom: 12px;
}

.description {
    color: #aaa;
    line-height: 1.8;
    margin-bottom: 25px;
}

.start-btn {
    background: #ffcc00;
    color: #111;
    border: none;
    border-radius: 10px;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.start-btn:hover {
    background: #ffe066;
    transform: scale(1.04);
}

#gameSection {
    display: none;
    margin-top: 25px;
}

.game-frame {
    width: 100%;
    max-width: 900px;
    height: 540px;
    margin: auto;
    border: 2px solid #ffcc00;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
}

.game-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.rotate-message {
    display: none;
    position: fixed;
    inset: 0;
    background: #101010;
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 25px;
}

.rotate-icon {
    font-size: 75px;
    margin-bottom: 20px;
    animation: rotate 2s infinite ease-in-out;
}

.rotate-message h2 {
    color: #ffcc00;
}

.rotate-message p {
    color: #bbb;
    line-height: 1.8;
}

@keyframes rotate {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
}

.footer {
    margin-top: 25px;
    color: #666;
    font-size: 12px;
}

@media (max-width: 768px) {
    body {
        padding: 15px;
    }

    .logo {
        font-size: 25px;
    }

    .game-card {
        padding: 25px 15px;
    }

    .game-frame {
        height: 55vh;
        min-height: 250px;
    }
}

@media (orientation: portrait) and (max-width: 1024px) {
    body.playing #rotateMessage {
        display: flex;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        X-RAY <span>CLINIC</span>
    </div>

    <div class="subtitle">
        RADIOGRAPHY SIMULATION EXPERIENCE
    </div>

    <div class="game-card" id="welcome">
        <div class="xray-icon">☢️</div>

        <h2>X-RAY CLINIC SIMULATOR</h2>

        <p class="description">
            استعد لخوض تجربة محاكاة تقنية الأشعة السينية.
            <br>
            اكتشف عالم التصوير الشعاعي وابدأ رحلتك كفني أشعة.
        </p>

        <button class="start-btn" onclick="startGame()">
            ابدأ اللعبة الآن
        </button>
    </div>

    <div id="gameSection">

        <div class="game-frame">
            <iframe
                id="gameFrame"
                title="X-Ray Clinic Simulator"
                allow="fullscreen; autoplay; gamepad"
                allowfullscreen>
            </iframe>
        </div>

    </div>

    <div class="footer">
        X-RAY CLINIC SIMULATOR © 2026
    </div>

</div>

<!-- رسالة تدوير الجهاز -->

<div class="rotate-message" id="rotateMessage">
    <div class="rotate-icon">📱</div>

    <h2>قم بتدوير جهازك</h2>

    <p>
        للحصول على أفضل تجربة لعب،
        <br>
        يرجى تدوير الهاتف أو التابلت إلى الوضع الأفقي.
    </p>
</div>

<script>

function startGame() {

    document.body.classList.add("playing");

    document.getElementById("welcome").style.display = "none";

    document.getElementById("gameSection").style.display = "block";

    document.getElementById("gameFrame").src =
    "https://sh6oi.github.io/X-RAY-CLINIC-SIMULATOR/docs/";

}

// محاولة قفل اتجاه الجهاز أفقياً عند دعم المتصفح

async function lockLandscape() {
    try {
        if (screen.orientation &&
            screen.orientation.lock) {
            await screen.orientation.lock("landscape");
        }
    } catch (e) {
        // بعض المتصفحات لا تسمح بقفل الاتجاه
    }
}

</script>

</body>
</html>
