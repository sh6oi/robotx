
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>X-RAY CLINIC SIMULATOR</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101010;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.container {
    width: 100%;
    max-width: 500px;
    text-align: center;
}

.logo {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 8px;
    letter-spacing: 1px;
}

.logo span {
    color: #ffcc00;
}

.subtitle {
    color: #888;
    font-size: 12px;
    margin-bottom: 22px;
}

.game-card {
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 22px 15px;
    box-shadow: 0 8px 25px #0007;
}

.xray-icon {
    font-size: 45px;
    margin-bottom: 12px;
}

h2 {
    font-size: 19px;
    margin-bottom: 10px;
}

.description {
    color: #aaa;
    font-size: 13px;
    line-height: 1.8;
    margin-bottom: 20px;
}

.start-btn {
    background: #ffcc00;
    color: #111;
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.start-btn:hover {
    background: #ffe066;
    transform: scale(1.03);
}

#gameSection {
    display: none;
    margin-top: 18px;
}

.game-frame {
    width: 100%;
    max-width: 500px;
    height: 300px;
    margin: auto;
    border: 2px solid #ffcc00;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
}

.game-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.footer {
    margin-top: 18px;
    color: #666;
    font-size: 10px;
}

/* رسالة تدوير الجهاز */

.rotate-message {
    display: none;
    position: fixed;
    inset: 0;
    background: #101010;
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
}

.rotate-icon {
    font-size: 65px;
    margin-bottom: 18px;
    animation: rotate 2s infinite ease-in-out;
}

.rotate-message h2 {
    color: #ffcc00;
    font-size: 22px;
}

.rotate-message p {
    color: #aaa;
    font-size: 14px;
    line-height: 1.8;
}

@keyframes rotate {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
}

/* الهواتف والآيباد */

@media (max-width: 768px) {
    .container {
        max-width: 430px;
    }

    .game-frame {
        height: 260px;
    }
}

/* الوضع العمودي */

@media (orientation: portrait) and (max-width: 1024px) {
    body.playing #rotateMessage {
        display: flex;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        X-RAY <span>CLINIC</span>
    </div>

    <div class="subtitle">
        RADIOGRAPHY SIMULATION EXPERIENCE
    </div>

    <div class="game-card" id="welcome">

        <div class="xray-icon">☢️</div>

        <h2>X-RAY CLINIC SIMULATOR</h2>

        <p class="description">
            استعد لخوض تجربة محاكاة تقنية الأشعة السينية.
            <br>
            ابدأ رحلتك كفني أشعة واكتشف عالم التصوير الشعاعي.
        </p>

        <button class="start-btn" onclick="startGame()">
            ابدأ اللعبة الآن
        </button>

    </div>

    <div id="gameSection">

        <div class="game-frame">

            <iframe
                id="gameFrame"
                title="X-Ray Clinic Simulator"
                allow="fullscreen; autoplay; gamepad"
                allowfullscreen>
            </iframe>

        </div>

    </div>

    <div class="footer">
        X-RAY CLINIC SIMULATOR © 2026
    </div>

</div>

<!-- رسالة تدوير الهاتف -->

<div class="rotate-message" id="rotateMessage">

    <div class="rotate-icon">📱</div>

    <h2>قم بتدوير جهازك</h2>

    <p>
        يرجى تدوير الهاتف أو التابلت إلى الوضع الأفقي
        <br>
        للاستمتاع بتجربة اللعب.
    </p>

</div>

<script>

function startGame() {

    document.body.classList.add("playing");

    document.getElementById("welcome").style.display = "none";

    document.getElementById("gameSection").style.display = "block";

    document.getElementById("gameFrame").src =
    "https://sh6oi.github.io/X-RAY-CLINIC-SIMULATOR/docs/";

}

</script>

</body>
</html>
